name: Update Scholar metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-scholar-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update homepage citation badges
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python3 tools/update_scholar_metrics.py

      - name: Commit metric updates
        run: |
          TARGETS="index.html"
          if [ -f zh.html ]; then
            TARGETS="$TARGETS zh.html"
          fi
          if git diff --quiet -- $TARGETS; then
            echo "Scholar metrics are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TARGETS
          git commit -m "Update Scholar metrics"
          git push
